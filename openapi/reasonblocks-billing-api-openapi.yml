openapi: 3.2.0
info:
  title: ReasonBlocks Billing API
  description: ReasonBlocks REST API.
  version: 0.1.0
tags:
- name: Billing
paths:
  /v1/billing/meter:
    get:
      tags:
      - Billing
      summary: Get Meter
      description: 'Return ``{plan, used, cap, over_cap, org_id}`` for an org.


        Authorization:

        * Static (admin) keys may query any org.

        * Per-customer keys may only query their own org -- the principal''s

        ``org_id`` is the source of truth; a mismatch with the query

        param is rejected.

        * JWT (dashboard) callers must have ``org_id`` in their

        ``allowed_orgs``.'
      operationId: get_meter_v1_billing_meter_get
      security:
      - HTTPBearer: []
      parameters:
      - name: org_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
          title: Org Id
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 0
          description: If >0, include per-day timeseries for the trailing N days.
          default: 0
          title: Days
        description: If >0, include per-day timeseries for the trailing N days.
      - name: token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key (EventSource fallback)
          title: Token
        description: API key (EventSource fallback)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Meter V1 Billing Meter Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
