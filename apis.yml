aid: reasonblocks
name: ReasonBlocks
description: >-
  ReasonBlocks is a Y Combinator (Spring 2026) startup building a drop-in runtime
  layer that makes production AI agents observable, self-correcting, and cheaper to
  run. The platform detects failing agent trajectories (loops and redundant work),
  compresses stale tool outputs and message histories to cut token spend, and builds
  a private learning library of reasoning patterns (E-traces) that steer future runs.
  It ships as a Python SDK with first-party integrations for LangChain, LangGraph,
  the OpenAI Agents SDK, and the Anthropic Claude / Claude Agent SDK, plus a
  language-agnostic REST API (rb-api) so any custom agent harness can wire in over
  three HTTP calls. Reported results include a 42% accuracy gain and ~52% token
  reduction on SWE-bench Pro.
